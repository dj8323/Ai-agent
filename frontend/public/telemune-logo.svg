<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 50" role="img" aria-label="Telemune">
  <!-- Telemune mark (from telemune.com) recoloured with the TelemuneSmartAi gradient -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <mask id="m" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="50">
      <image href="data:image/png;base64," width="48" height="50"/>
    </mask>
  </defs>
  <rect width="48" height="50" fill="url(#g)" mask="url(#m)"/>
</svg>

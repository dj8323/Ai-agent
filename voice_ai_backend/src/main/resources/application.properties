# voice_ai_backend (TelemuneSmartAi API). Started from its own folder (run.sh), so .env, config.json, data/ and logs/
# are found there. Secrets and DB settings come from .env (KEY=VALUE, read as properties) or the environment.
spring.config.import=optional:file:.env[.properties],optional:file:keys.env[.properties]
spring.application.name=smartai-backend

server.port=${BACKEND_PORT:8324}
# 127.0.0.1 = only voice_ai_web on the same machine can reach it; 0.0.0.0 when voice_ai_web runs on another server.
server.address=${BACKEND_HOST:127.0.0.1}
server.error.whitelabel.enabled=false
spring.mvc.async.request-timeout=-1
spring.servlet.multipart.enabled=false
spring.jackson.default-property-inclusion=always

# MySQL (database ai-agent, created if missing). Every DATETIME is UTC.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai-agent}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never

# Backend folder: config.json (seed) and data/users/<id>/recordings live here.
app.home=${APP_HOME:.}
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Logging: see logback-spring.xml (logs/backend.log = everything, logs/error.log = WARN+). Levels: LOG_LEVEL, SQL_LOG in .env.
